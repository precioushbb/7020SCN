name: My Finance CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: pnpm exec vitest run tests/unit
      - name: Run component tests
        id: component
        continue-on-error: true
        run: pnpm exec vitest run tests/component
      - name: Run integration tests
        id: integration
        continue-on-error: true
        run: |
          if [ -d tests/integration ] && find tests/integration -type f \( -name '*.spec.js' -o -name '*.test.js' \) | grep -q .; then
            pnpm exec vitest run tests/integration
          else
            echo 'No integration test files found; skipping.'
          fi
      - name: Generate combined coverage report
        id: coverage
        continue-on-error: true
        run: pnpm exec vitest run tests/unit tests/component tests/integration --coverage
      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: pnpm exec eslint -c ./eslint.config.js 'src/**/*.{js,mjs,cjs,vue}'
      - name: Build Quasar SPA
        id: build
        continue-on-error: true
        run: pnpm exec quasar build -m spa
      - name: Upload combined Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production SPA build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finance-spa-build
          path: dist/spa/
          if-no-files-found: error
          retention-days: 14
      - name: Report quality results
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          COMPONENT: ${{ steps.component.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo '## Finance app quality results (report-only)'
            echo '| Check | Outcome |'
            echo '|---|---|'
            echo "| Unit tests | $UNIT |"
            echo "| Component tests | $COMPONENT |"
            echo "| Integration tests | $INTEGRATION |"
